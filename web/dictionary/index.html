<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Sets data-theme before first paint, so there's no flash of the wrong
         theme while theme.ts loads. Mirrors theme.ts's own resolution order:
         a remembered manual choice, else the OS preference. -->
    <script>
      (function () {
        var t = localStorage.getItem('oifd-theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <!-- Inline so it costs no request, and so there is no 404 in the console to
         mask a real one. Three ledger rules in the ochre accent. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23eef0ea'/%3E%3Cg fill='%23a06e24'%3E%3Crect x='3' y='4' width='10' height='1.6'/%3E%3Crect x='3' y='7.2' width='7' height='1.6'/%3E%3Crect x='3' y='10.4' width='9' height='1.6'/%3E%3C/g%3E%3C/svg%3E"
    />
    <title>Open Indian Fund Data — Dictionary</title>
    <meta
      name="description"
      content="What's in the dataset: tables, columns, how they join, and where every number comes from."
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/dictionary-main.ts"></script>
  </body>
</html>
